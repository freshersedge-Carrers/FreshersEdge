<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scan QR | FreshersEdge</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container">

<a class="navbar-brand fw-bold text-primary fs-3" href="index.html">

<img src="images/logo.jpeg" width="45" class="me-2">

FreshersEdge

</a>

</div>

</nav>

<!-- HEADER -->

<section class="bg-light py-5">

<div class="container text-center">

<h1 class="fw-bold">Scan & Pay</h1>

<p class="text-muted">
Complete your payment using any UPI application.
</p>

</div>

</section>

<!-- PAYMENT DETAILS -->

<section class="py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow border-0 rounded-4">

<div class="card-body p-5 text-center">

<h3 class="mb-4">
Payment Summary
</h3>

<table class="table table-bordered">

<tr>
<th width="40%">Customer</th>
<td id="customerName"></td>
</tr>

<tr>
<th>Service</th>
<td id="service"></td>
</tr>

<tr>
<th>Amount</th>
<td id="amount"></td>
</tr>

<tr>
<th>Bank</th>
<td id="bank"></td>
</tr>

</table>

<hr>

<img
id="qrImage"
class="img-fluid rounded shadow"
style="max-width:300px;">

<h4
class="text-primary mt-4"
id="upiId">
</h4>

<p class="mt-3 text-success fw-bold">
After completing the payment, click the button below.
</p>

<button
class="btn btn-success btn-lg px-5"
onclick="goVerification()">

I Have Paid
<i class="fa-solid fa-arrow-right ms-2"></i>

</button>

</div>

</div>

</div>

</div>

</div>

</section>

<script>

window.onload = function () {

document.getElementById("customerName").innerHTML =
localStorage.getItem("customerName") || "";

document.getElementById("service").innerHTML =
localStorage.getItem("service") || "";

document.getElementById("amount").innerHTML =
"₹ " + (localStorage.getItem("amount") || "");

document.getElementById("bank").innerHTML =
localStorage.getItem("bank") || "";

document.getElementById("upiId").innerHTML =
"UPI ID : " + (localStorage.getItem("upi") || "");

document.getElementById("qrImage").src =
localStorage.getItem("qr") || "";

};

function goVerification(){

window.location.href = "verification.html";

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
