<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Login | FreshersEdge</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="css/style.css">

<style>

body{

background:#f4f7fb;

}

.login-card{

max-width:450px;

margin:70px auto;

border-radius:20px;

}

.logo{

font-size:60px;

color:#0d6efd;

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container">

<a class="navbar-brand fw-bold fs-3 text-primary"
href="index.html">

FreshersEdge

</a>

</div>

</nav>

<div class="container">

<div class="card shadow login-card">

<div class="card-body p-5">

<div class="text-center">

<i class="fa-solid fa-user-shield logo"></i>

<h2 class="mt-3">

Admin Login

</h2>

<p class="text-muted">

Authorized Access Only

</p>

</div>

<div class="mb-3">

<label>

Email

</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter Admin Email">

</div>

<div class="mb-4">

<label>

Password

</label>

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password">

</div>

<div class="d-grid">

<button
class="btn btn-primary btn-lg"
onclick="login()">

Login

</button>

</div>

</div>

</div>

</div>

<script src="js/admin-login.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
