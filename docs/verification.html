<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Verification | FreshersEdge</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container">

<a class="navbar-brand fw-bold text-primary fs-3"
href="index.html">

<img src="images/logo.jpeg"
width="45"
class="me-2">

FreshersEdge

</a>

</div>

</nav>

<!-- Header -->

<section class="bg-light py-5">

<div class="container text-center">

<h1 class="fw-bold">

Payment Verification

</h1>

<p class="text-muted">

Verify your payment before submission.

</p>

</div>

</section>

<!-- Form -->

<section class="py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow border-0 rounded-4">

<div class="card-body p-5">

<form id="verifyForm">

<h3 class="mb-4">

Customer Details

</h3>

<table class="table table-bordered">

<tr>
<th width="35%">Customer</th>
<td id="customerText"></td>
</tr>

<tr>
<th>Mobile</th>
<td id="mobileText"></td>
</tr>

<tr>
<th>Email</th>
<td id="emailText"></td>
</tr>

<tr>
<th>Service</th>
<td id="serviceText"></td>
</tr>

<tr>
<th>Amount</th>
<td id="amountText"></td>
</tr>

<tr>
<th>Bank</th>
<td id="bankText"></td>
</tr>

</table>

<hr>

<div class="mb-3">

<label class="form-label">

Transaction / UTR Number

</label>

<input
type="text"
id="utr"
class="form-control"
placeholder="Enter UTR Number"
required>

</div>

<div class="mb-4">

<label class="form-label">

Upload Payment Screenshot

</label>

<input
type="file"
id="paymentImage"
class="form-control"
accept="image/*"
required>

</div>

<div class="text-center">

<img
id="preview"
style="display:none;
max-width:350px;
border-radius:10px;">

</div>

<div class="mt-4 text-center">

<button
type="submit"
class="btn btn-success btn-lg px-5">

Submit Payment

<i class="fa-solid fa-circle-check ms-2"></i>

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</section>

<script>

window.onload=function(){

document.getElementById("customerText").innerHTML=
localStorage.getItem("customerName")||"";

document.getElementById("mobileText").innerHTML=
localStorage.getItem("mobile")||"";

document.getElementById("emailText").innerHTML=
localStorage.getItem("email")||"";

document.getElementById("serviceText").innerHTML=
localStorage.getItem("service")||"";

document.getElementById("amountText").innerHTML=
"₹ "+(localStorage.getItem("amount")||"");

document.getElementById("bankText").innerHTML=
localStorage.getItem("bank")||"";

};

document.getElementById("paymentImage").addEventListener("change",function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(e){

document.getElementById("preview").src=e.target.result;

document.getElementById("preview").style.display="block";

};

reader.readAsDataURL(file);

}

});

document.getElementById("verifyForm").addEventListener("submit",function(e){

e.preventDefault();

let utr=document.getElementById("utr").value.trim();

if(utr===""){

alert("Please enter UTR Number");

return;

}

if(document.getElementById("paymentImage").files.length===0){

alert("Please upload payment screenshot");

return;

}

/* Demo Only */

window.location.href="success.html";

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
